// alias net_hitscan "cl_interp 0.030303; cl_interp_ratio 2; echo NET: 5G HITSCAN"
// alias net_project "cl_interp 0.045454; cl_interp_ratio 3; echo NET: 5G PROJECTILE"


// Water
alias cheap_water_override cheap_water_never
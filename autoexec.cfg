// Autoexec

// map_background itemtest; wait 10; disconnect
// map_background background01; wait 10; disconnect
net_graph 1

// Spy health
tf_hud_target_id_disable_floating_health 1

// Hitsound
tf_dingaling_pitchmindmg 140
tf_dingaling_pitchmaxdmg 5


// Viewmodel FOV Toggle System
alias "vm_off" "viewmodel_fov 0; alias toggle_vm vm_on"
alias "vm_on" "viewmodel_fov 90; alias toggle_vm vm_off"
alias "toggle_vm" "vm_off"
bind "ALT" "toggle_vm"
alias "reset_vm" "viewmodel_fov 90; alias toggle_vm vm_off"

// Improved Zoom Macro
alias "+custom_zoom" "fov_desired 75; r_drawviewmodel 0; echo ZOOM ON" 
alias "-custom_zoom" "fov_desired 90; r_drawviewmodel 1; reset_vm; echo ZOOM OFF" 
bind "SHIFT" "+custom_zoom"
bind "MOUSE3" "+custom_zoom"

// Weapon Switch Functions with Viewmodel Enable
alias switch_to_primary "slot1; r_drawviewmodel 1; reset_vm; update_weapon_state_primary; echo SWITCHED TO PRIMARY"
alias switch_to_secondary "slot2; r_drawviewmodel 1; reset_vm; update_weapon_state_secondary; echo SWITCHED TO SECONDARY"
alias switch_to_melee "slot3; r_drawviewmodel 1; reset_vm; update_weapon_state_melee; echo SWITCHED TO MELEE"

// Q Key Actions
alias q_action_primary "echo QACTION PRIMARY; switch_to_secondary"
alias q_action_secondary "echo QACTION SECONDARY; switch_to_primary"
alias q_action_melee "echo QACTION MELEE; switch_to_secondary"
alias q_action "q_action_primary"
bind "Q" "q_action"

// E Key Actions
alias e_action_primary "switch_to_melee"
alias e_action_secondary "switch_to_melee"
alias e_action_melee "switch_to_primary"
alias e_action "e_action_primary"
bind "E" "e_action"

// Update Weapon State Functions
alias update_weapon_state_primary "alias curr_weapon_state primary; alias q_action q_action_primary; alias e_action e_action_primary"
alias update_weapon_state_secondary "alias curr_weapon_state secondary; alias q_action q_action_secondary; alias e_action e_action_secondary"
alias update_weapon_state_melee "alias curr_weapon_state melee; alias q_action q_action_melee; alias e_action e_action_melee"

// Bind Weapon Slots with Viewmodel Enable and Reset
bind "1" "switch_to_primary;lastdisguise"
bind "2" "switch_to_secondary;lastdisguise"
bind "3" "switch_to_melee;lastdisguise"

// Initial Weapon State
update_weapon_state_primary

// Bind keys for weapon slots 4 and 5 with Viewmodel Enable
bind "4" "slot4; r_drawviewmodel 1; reset_vm"
bind "5" "slot5; r_drawviewmodel 1; reset_vm"

// Unbinds
unbind "MWHEELDOWN"

// Respawn script
bind "KP_INS" "load_itempreset 0"         // Numpad 0 for Loadout 1
bind "KP_END" "load_itempreset 1"         // Numpad 1 for Loadout 2
bind "KP_DOWNARROW" "load_itempreset 2"   // Numpad 2 for Loadout 3
bind "KP_PGDN" "load_itempreset 3"        // Numpad 3 for Loadout 4

// Fix all
bind "KP_MINUS" "record temp;stop;snd_restart;hud_reloadscheme;heartbeat;"


// Null-Cancelling Movement Script
bind "w" "+mfwd"
bind "s" "+mback"
bind "a" "+mleft"
bind "d" "+mright"
alias "+mfwd" "-back; +forward; alias checkfwd +forward"
alias "-mfwd" "-forward; checkback; alias checkfwd none"
alias "+mback" "-forward; +back; alias checkback +back"
alias "-mback" "-back; checkfwd; alias checkback none"
alias "+mleft" "-moveright; +moveleft; alias checkleft +moveleft"
alias "-mleft" "-moveleft; checkright; alias checkleft none"
alias "+mright" "-moveleft; +moveright; alias checkright +moveright"
alias "-mright" "-moveright; checkleft; alias checkright none"
alias checkfwd "none"
alias checkback "none"
alias checkleft "none"
alias checkright "none"
alias none ""


// --- VISIBILITY & COMBAT QOL ---
tf_enable_glows_after_respawn 1     // Team outlines on spawn
tf_spec_xray_disable 0              // Outlines while spectating
tf_use_min_viewmodels 1             // Smaller weapons for better FOV
hud_combattext_batching 1           // Adds damage numbers together
hud_combattext_batching_window 0.4  // Max time between hits to add numbers
tf_medigun_autoheal 1               // Click once to heal teammates
m_rawinput 1                        // 1:1 mouse tracking
zoom_sensitivity_ratio 0.793471     // 1:1 sniper scope sensitivity


// --- BASE NETWORK RATES ---
cl_cmdrate 66
cl_updaterate 66
rate 1048576

// --- INTERP ALIASES (CRISP) ---
alias net_hitscan "cl_interp 0.015151; cl_interp_ratio 1; echo NET: HITSCAN"
alias net_project "cl_interp 0.030303; cl_interp_ratio 2; echo NET: PROJECTILE"

// ==========================================
// --- 5G JITTER / LAG OVERRIDES ---
// If your hotspot gets laggy, UNCOMMENT the 3 lines below to force a larger safety buffer.
// rate 196608 lowers bandwidth to prevent cellular bufferbloat.
// The aliases force a thicker buffer for both hitscan and projectile to absorb packet delay.
// ==========================================
